  <h1>80C552 Simulator <small>(js51 core + 80C552 SFR/ADC/external-bus extension)</small></h1>

    <div class="panel disassembly-panel" data-title="Disassembly" id="disassemblyView"></div>

      <div class="panel">
        
        <div class="row">
          
          <button id="btn_reset">Reset</button>
          <button id="btn_step">Step 1</button>
          <button id="btn_step100">Step 100</button>
          <button id="btn_step1000">Step 1000</button>
          <button id="btn_run">Run</button>
          <button id="btn_stop">Stop</button>
          <button id="btn_print_callstack">Print Callstack</button>
          <span id="run_status" style="margin-left:10px;color:#888;"></span>
        </div>

          <div class="panel">
            <div class="row">
              <label title="Run the simulator in real 11.0592 MHz / 80C552-speed. Uncheck to use max speed (Turbo).">
                <input style="margin-bottom: 10px;" type="checkbox" id="use_realTimeThrottle">
                Enable Realtime Throttle
              </label>
            </div>
          </div>
          <div class="panel">
            <div class="row">
              <label for="cpu_speed_multipler">Speed Multipler:</label>
              <input type="number" id="cpu_speed_multipler" name="value" min="0.01" step="0.01" value="1.0" style="width:56px;">
            </div>
          </div>
          <div class="panel">
            <div class="row">
              <label title="When checked the RTC is updated using the System Clock, this makes it impossible to set the time from witchin the simulation, uncheck to make it fully simulated, when unchecked the time can be set.">
                <input style="margin-bottom: 10px;" type="checkbox" checked="" id="rtc_use_system_clock">
                RTC: Use System Clock
              </label>
            </div>
          </div>
        
    </div>

    <div class="row">
      <div class="panel" style="min-width:90px;"><h2>Core Registers</h2><table id="coreRegs"></table></div>
      <div class="panel" style="min-width:90px;"><h2>Peripheral Regs</h2><table id="peripheralRegs"></table></div>
      <div class="panel" style="min-width:440px;"><h2>INTERNAL RAM</h2><div class="memdump" id="iram_dump" style="max-height: 400px;"></div></div>
      <div class="panel" style="min-width:130px;"><h2>Sensor Inputs</h2><div id="input_signals"></div></div>
      <div class="panel" style="max-width:100px;"><h2>Power Control Outputs</h2><table id="pwr_output_signals"></table></div>
      <div class="panel" id="front-panel" data-title="Front Panel" data-title2="(simulated like a real one)"></div>

      <div class="panel" id="service_interface" data-title="Service Interface (simulated like a real one)"></div>
    </div>

    <div class="row">
      <div class="panel xram_view" data-title="SRAM (62256) — 256 bytes window A" data-start_index="10"></div>
      <div class="panel xram_view" data-title="SRAM (62256) — 256 bytes window B" data-start_index="22"></div>
      <!--<div class="panel xram_view" data-title="SRAM (62256) — 256 bytes window C" data-start_index="27"></div>-->
