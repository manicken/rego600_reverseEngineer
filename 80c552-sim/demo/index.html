<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="led-panel.css">
  <link rel="stylesheet" href="modal.css">
  <link rel="stylesheet" href="hex-editor.css">
  <link rel="stylesheet" href="panel_disassembly.css">
  <link rel="stylesheet" href="panel_disassembly_goto_label_form.css">
  <link rel="stylesheet" href="panel_disassembly_list_label_references_form.css">
  <link rel="stylesheet" href="settings_form.css">
  <link rel="stylesheet" href="menu.css">
  <meta charset="UTF-8">
  <title>80C552 Simulator (js51-based)</title>
</head>
<body>

  <!-- hex function -->
  <script src="helpers.js"></script>
  <script src="dom_helpers.js"></script>
  <script src="modal.js"></script>
  <script src="hex-editor.js"></script>

  <!-- vendor js51 core (unmodified) -->
  <script src="../vendor/51vm_core.js"></script>
  <script src="../vendor/51vm_operand.js"></script>
  <script src="../vendor/51vm_operation.js"></script>
  <script src="../vendor/51vm_opcode_decoder.js"></script>
  <script src="../vendor/51vm_disassembler.js"></script>
  <script src="../vendor/51vm_ctl.js"></script>
  <script src="../vendor/hex_decoder.js"></script>

  <!-- 80C552 extension -->
  <script src="../80c552/80c552_sfr.js"></script>
  <script src="../80c552/80c552_adc_valueBased.js"></script>
  <script src="../80c552/device_62256.js"></script>
  <script src="../80c552/device_am29f040.js"></script>
  <script src="../80c552/membus.js"></script>
  <script src="../80c552/i2c_bus.js"></script>


  <script src="../80c552/80c552.js"></script>
  <script src="../80c552/logging.js"></script>
  <script src="../80c552/uart.js"></script>

  <!-- built in code mem -->
  <script src="builtin_code.js"></script>
  <script src="builtin_data.js"></script>

  <!-- 80C552 bitbang devices -->
  <script src="../80c552/gpio_bitbang.js"></script>
  <script src="../80c552/device_DS1302.js"></script>
  <script src="../80c552/device_TC1232.js"></script>
  <script src="../80c552/device_CD4021.js"></script>
  <script src="../80c552/device_CD4094.js"></script>
  <script src="../80c552/device_CD4051.js"></script>
  <script src="../80c552/device_Inverter.js"></script>

  <script src="panel_front_panel.js"></script> 
  <script src="panel_registers.js"></script> 
  <script src="panel_sensor_inputs.js"></script> 
  <script src="panel_service_interface.js"></script> 
  <script src="panels_memory.js"></script> 
  <script src="panel_disassembly.js"></script>
  <script src="panel_disassembly_goto_label_form.js"></script>
  <script src="panel_disassembly_list_label_references_form.js"></script>
  <script src="panel_disassembly_contextmenu.js"></script>
  <script src="settings_form.js"></script>
  <script src="profiling.js"></script>
  <script src="menu.js"></script>
 
 

  <script src="firmware_profiles.js"></script>

  <script src="main.js"></script>

  <!-- BODY CONTENTS -->

  <div class="row main-layout">
    <div>
      <div class="panel">
      <div class="main-menu" id="main-menu"></div>  
      </div>
      <div class="panel disassembly-panel" data-title="Disassembly" id="disassemblyView"></div>
    </div>
    
    <div class="simulator-content">
      <div class="panel">
      <div class="row">
          <button id="btn_reset">Reset</button>
          <button id="btn_step">Step 1</button>
          <button id="btn_step100">Step 100</button>
          <button id="btn_step1000">Step 1000</button>
          <button id="btn_run">Run</button>
          <button id="btn_stop">Stop</button>
          <button id="btn_print_callstack">Print Callstack</button>
          <span id="run_status" style="margin-left:10px;color:#888;"></span>
        </div>
        </div>
      <div class="row">
        <div class="panel" style="max-width:95px;"><h2>Core Registers</h2><table id="coreRegs"></table></div>
        <div class="panel" style="min-width:440px;"><h2>INTERNAL RAM</h2><div class="memdump" id="iram_dump" style="max-height: 400px;"></div></div>
        <div class="panel" style="min-width:130px;"><h2>Sensor Inputs</h2><div id="input_signals"></div></div>
        <div class="panel" style="max-width:120px;"><h2>Power Control Outputs</h2><table id="pwr_output_signals"></table></div>
        <div class="panel" id="front-panel" data-title="Front Panel" data-title2="(simulated like a real one)"></div>
        <div class="panel" id="service_interface" data-title="Service Interface (simulated like a real one)"></div>
      </div>
      <div class="row">
        <div class="panel" style="max-width:95px;"><h2>Peripheral Regs</h2><table id="peripheralRegs"></table></div>
        <div class="panel xram_view" data-title="SRAM (62256) — 256 bytes window A" data-start_index="10"></div>
        <div class="panel xram_view" data-title="SRAM (62256) — 256 bytes window B" data-start_index="22"></div>
        <!--<div class="panel xram_view" data-title="SRAM (62256) — 256 bytes window C" data-start_index="27"></div>-->
        <div class="panel" id="directWriteXRAM" data-title="SRAM (62256) — Direct Write"></div>
      </div>
  </div>
  </div>
  <div class="panel">
    <h2>Log</h2>
    <div id="log"></div>
  </div>
</body>
</html>
