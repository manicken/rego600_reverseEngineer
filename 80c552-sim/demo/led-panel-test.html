```html
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REGO600 LED Panel</title>

<style>
    body {
        margin: 0;
        padding: 40px;

        background: #181818;
        font-family: Arial, sans-serif;
    }

    .rego-led-panel {
        display: flex;
        align-items: center;
        gap: 22px;

        padding: 14px 20px;

        background: linear-gradient(
            180deg,
            #303030 0%,
            #222222 100%
        );

        border: 1px solid #111;
        border-radius: 6px;

        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.08),
            0 2px 5px rgba(0,0,0,0.5);

        width: fit-content;
    }

    .rego-led {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;

        min-width: 58px;

        cursor: pointer;
        user-select: none;
    }

    .rego-led .led {
        width: 13px;
        height: 13px;

        border-radius: 50%;

        background: #111;

        border: 1px solid #080808;

        box-shadow:
            inset 0 1px 2px rgba(0,0,0,0.9);

        transition:
            background 0.08s,
            box-shadow 0.08s;
    }

    .rego-led .label {
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.7px;

        color: #aaa;

        white-space: nowrap;
    }

    /*
     * POWER
     */
    #led-power.on .led {
        background: #4caf50;

        box-shadow:
            0 0 4px rgba(76,175,80,0.9),
            0 0 10px rgba(76,175,80,0.6),
            inset 0 1px 2px rgba(255,255,255,0.35);
    }

    /*
     * PUMP
     */
    #led-pump.on .led {
        background: #4fc3f7;

        box-shadow:
            0 0 4px rgba(79,195,247,0.9),
            0 0 10px rgba(79,195,247,0.6),
            inset 0 1px 2px rgba(255,255,255,0.35);
    }

    /*
     * ADD HEAT
     */
    #led-addheat.on .led {
        background: #ff9800;

        box-shadow:
            0 0 4px rgba(255,152,0,0.9),
            0 0 10px rgba(255,152,0,0.6),
            inset 0 1px 2px rgba(255,255,255,0.35);
    }

    /*
     * WARM WATER
     */
    #led-warmwater.on .led {
        background: #29b6f6;

        box-shadow:
            0 0 4px rgba(41,182,246,0.9),
            0 0 10px rgba(41,182,246,0.6),
            inset 0 1px 2px rgba(255,255,255,0.35);
    }

    /*
     * ALARM
     */
    #led-alarm.on .led {
        background: #f44336;

        box-shadow:
            0 0 4px rgba(244,67,54,0.9),
            0 0 10px rgba(244,67,54,0.6),
            inset 0 1px 2px rgba(255,255,255,0.35);
    }

    /*
     * Hover - bara lite feedback vid testning
     */
    .rego-led:hover .label {
        color: #ddd;
    }

    .rego-led:hover .led {
        border-color: #333;
    }
</style>
</head>

<body>

<div class="rego-led-panel">

    <div class="rego-led" id="led-power" onclick="toggleLed('power')">
        <span class="led"></span>
        <span class="label">POWER</span>
    </div>

    <div class="rego-led" id="led-pump" onclick="toggleLed('pump')">
        <span class="led"></span>
        <span class="label">PUMP</span>
    </div>

    <div class="rego-led" id="led-addheat" onclick="toggleLed('addheat')">
        <span class="led"></span>
        <span class="label">ADD HEAT</span>
    </div>

    <div class="rego-led" id="led-warmwater" onclick="toggleLed('warmwater')">
        <span class="led"></span>
        <span class="label">WARM WATER</span>
    </div>

    <div class="rego-led" id="led-alarm" onclick="toggleLed('alarm')">
        <span class="led"></span>
        <span class="label">ALARM</span>
    </div>

</div>

<script>

function setLed(name, state) {
    document
        .getElementById(`led-${name}`)
        .classList.toggle("on", state);
}

function toggleLed(name) {
    const led = document.getElementById(`led-${name}`);

    led.classList.toggle("on");
}


// Testläge:
// Klicka på LED:erna för att slå dem av/på.
//
// Exempel på hur simulatorn senare kan styra dem:
//

// setLed("pump", true);
// setLed("addheat", false);
// setLed("warmwater", true);
// setLed("alarm", false);

</script>

</body>
</html>
